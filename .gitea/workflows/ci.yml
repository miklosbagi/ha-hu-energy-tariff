name: CI

# Gitea Actions equivalent of .github/workflows/ci.yml - same logic,
# ported because Gitea Actions' event payload schema (github.event.*)
# and most Actions marketplace actions are compatible with GitHub's, by
# design. Kept as close to the GitHub version as possible so the two
# don't drift apart silently.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # A fresh venv, not the toolcache interpreter's global
      # site-packages directly - see pip-audit.yml's install step for
      # the full story (confirmed live in two stages: this runner's
      # persistent hostedtoolcache leaves unconstrained requirements
      # like `homeassistant` stuck on whatever was first installed
      # here, and `--upgrade` alone didn't fix it either, pointing at
      # the restored pip cache as a second staleness source). Doesn't
      # currently change lint's pass/fail here, but running against a
      # six-month-stale homeassistant silently is still wrong.
      - name: Install dependencies
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install --no-cache-dir -r requirements-dev.txt

      # Lint only, not `ruff format --check` - the formatter's opinion
      # (e.g. a mandatory blank line after every module docstring)
      # conflicts with this repo's existing consistent style across
      # ~35 files. Adopting the formatter is a real, separate decision
      # (a large repo-wide reformat), not a side effect of adding lint.
      - name: Run ruff
        run: .venv-ci/bin/ruff check custom_components tests scripts

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Fresh venv: see the lint job's install step above.
      - name: Install dependencies
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install --no-cache-dir -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          .venv-ci/bin/pytest tests/unit -v \
            --cov=custom_components/hu_energy_tariff \
            --cov-report=term-missing \
            --cov-report=json:coverage-head.json

      - name: Enforce 80% coverage floor
        run: |
          .venv-ci/bin/python - <<'PY'
          import json, sys
          pct = json.load(open("coverage-head.json"))["totals"]["percent_covered"]
          print(f"Head coverage: {pct:.2f}%")
          sys.exit(0 if pct >= 80 else 1)
          PY

      # PR-only: compare against the base branch's coverage. Best-effort -
      # if the base branch predates coverage tooling, this step is
      # allowed to fail and only the floor above is enforced.
      - name: Checkout base branch for coverage-drop comparison
        if: github.event_name == 'pull_request'
        run: git worktree add /tmp/base-ref ${{ github.event.pull_request.base.sha }}

      - name: Run base-branch coverage (best-effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: /tmp/base-ref
        run: |
          python -m venv /tmp/base-venv
          /tmp/base-venv/bin/pip install --upgrade pip -q
          /tmp/base-venv/bin/pip install -r requirements-dev.txt -q
          /tmp/base-venv/bin/pytest tests/unit -q \
            --cov=custom_components/hu_energy_tariff \
            --cov-report=json:/tmp/coverage-base.json

      - name: Enforce max 10-point coverage drop vs. base branch
        if: github.event_name == 'pull_request'
        run: python scripts/check_coverage_drop.py --head coverage-head.json --base /tmp/coverage-base.json --max-drop 10
