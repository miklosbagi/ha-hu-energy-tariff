name: Do Not Merge

# Gitea Actions equivalent of .github/workflows/do-not-merge.yml - a
# required status check that fails whenever the DO_NOT_MERGE label is
# present, blocking merge via this repo's branch protection
# (status_check_contexts). See docs/RELEASING.md.
on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

jobs:
  check-do-not-merge:
    name: check-do-not-merge
    runs-on: ubuntu-latest
    steps:
      - name: Fail if DO_NOT_MERGE label is present
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "PR labels: $LABELS_JSON"
          # toJson() on an empty label set evaluates to the literal
          # string `null` (not `[]`) on at least this Gitea instance's
          # expression engine, unlike GitHub's - guard against that
          # rather than let json.load hand back None and crash `in`.
          HAS_DO_NOT_MERGE=$(echo "$LABELS_JSON" | python3 -c "import json, sys; data = json.load(sys.stdin); print('DO_NOT_MERGE' in (data if isinstance(data, list) else []))")
          if [ "$HAS_DO_NOT_MERGE" = "True" ]; then
            echo "::error::This PR is labeled DO_NOT_MERGE - remove the label to allow merging."
            exit 1
          fi
          echo "DO_NOT_MERGE label not present - OK"
