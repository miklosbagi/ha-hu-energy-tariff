name: Label PR

# Gitea Actions equivalent of .github/workflows/label-pr.yml. Uses the
# Gitea REST API directly (curl) rather than the `gh` CLI, which has no
# Gitea equivalent guaranteed present on the runner.
on:
  pull_request:
    types: [opened]

jobs:
  add-default-tag-label:
    name: add-default-tag-label
    runs-on: ubuntu-latest
    # Sync PRs (GitHub -> Gitea, see .gitea/workflows/sync-from-github.yml)
    # are pure fast-forward merges, not real work - a Tag/* label on them
    # is meaningless noise (Gitea doesn't mint releases anymore anyway,
    # see docs/RELEASING.md, but skip it regardless for tidiness).
    if: ${{ github.head_ref != 'github-sync' }}
    steps:
      # Every PR gets Tag/Patch by default (see docs/RELEASING.md) - the
      # author can remove it (or swap for Tag/Minor / Tag/Major) before
      # merge; removing every Tag/* label means the merge won't tag/release.
      #
      # Only if no Tag/* label is already present: this workflow fires on
      # `opened`, but a human or agent can add a different Tag/* label
      # around the same time (e.g. via the API, right after creating the
      # PR) - a real double-tagging bug hit live, where Tag/Minor (set
      # deliberately) ended up sitting alongside this workflow's own
      # unconditional Tag/Patch. release-and-promote.yml's precedence
      # (Major > Minor > Patch) meant the version computation was still
      # correct, but two contradictory labels on one PR is confusing and
      # easy to misread during review - check first, don't blindly add.
      #
      # --cacert: this runner's job containers have gitea.mb's internal
      # CA bundle bind-mounted at /certs/ca_bundle.crt (act_runner config,
      # agentic-home infra - originally added so git itself would trust
      # it via GIT_SSL_CAINFO, which only covers git, not curl). Without
      # this, curl fails with "unable to get local issuer certificate".
      # Deliberately proper trust, not -k/--insecure - see agentic-home's
      # memory/learned/docker.md for why that's the rejected anti-pattern
      # for this exact recurring problem.
      - name: Add Tag/Patch label (unless a Tag/* label is already present)
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          EXISTING_LABELS=$(curl -sSf \
            --cacert /certs/ca_bundle.crt \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            | jq -r '.[].name')

          if echo "$EXISTING_LABELS" | grep -q '^Tag/'; then
            echo "A Tag/* label is already present ($(echo "$EXISTING_LABELS" | tr '\n' ' ')) - not adding Tag/Patch on top of it."
            exit 0
          fi

          curl -sSf -X POST \
            --cacert /certs/ca_bundle.crt \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d '{"labels":["Tag/Patch"]}'
