name: Secret scan

# Content-based secret scanning on every PR -- same rollout as
# agentic-home/services-common/reference-service-repo. See
# agentic-home's memory/history/decisions.md, [2026-08-03] "Security
# audit findings #2, #3, #4, #5 closed" for the original rationale, and
# the follow-up entry rolling this out to every repo, not just those
# three.
on:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, not the default shallow clone -- gitleaks scans
          # commit history, not just the current tree.
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        run: |
          # Pinned + checksum-verified + OSV-checked, same pattern used
          # everywhere else this tool is deployed. Scans full history
          # (git log --all), not just this PR's diff, so a secret added
          # then "removed" in a later commit still gets caught. To bump:
          # check the new release's checksums.txt at
          # https://github.com/gitleaks/gitleaks/releases and update
          # both values together.
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -

          OSV_RESULT="$(curl -sf -X POST https://api.osv.dev/v1/query -H 'Content-Type: application/json' \
            -d "{\"version\":\"${GITLEAKS_VERSION}\",\"package\":{\"name\":\"github.com/gitleaks/gitleaks/v8\",\"ecosystem\":\"Go\"}}")"
          if echo "$OSV_RESULT" | jq -e '(.vulns // []) | length > 0' >/dev/null; then
            echo "::error::Known vulnerabilities found for gitleaks v${GITLEAKS_VERSION} -- see https://osv.dev"
            echo "$OSV_RESULT" | jq '.vulns[] | {id, summary}'
            exit 1
          fi
          echo "OSV: no known vulnerabilities for gitleaks v${GITLEAKS_VERSION}"

          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks git --log-opts="--all" -v
