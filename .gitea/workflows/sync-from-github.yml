name: Sync from GitHub

# GitHub accepts community contributions directly (Gitea is private, so
# external contributors can only ever reach the project through
# GitHub) - this keeps Gitea main from silently falling behind whenever
# that happens, by opening a PR that fast-forwards Gitea main to match
# GitHub main. Gitea can't receive inbound webhooks from GitHub
# (gitea.mb isn't reachable from the public internet), so this polls
# on a schedule instead.
#
# Only ever opens (or reuses) a PR - it deliberately does not merge
# it. A fast-forward merge would in principle be safe to automate
# (it can never rewrite history or discard anything), but Gitea's own
# permissions already enforce a human-must-merge rule for this repo
# regardless (the agent-rw identity behind GITEA_TOKEN has push access
# but not merge rights), and that's the model kept everywhere else in
# this project too - a human always clicks merge, on both platforms.
# So: same as the Gitea -> GitHub direction (promote-to-github.yml),
# just going the other way.
#
# If the two histories have genuinely diverged (both sides have
# commits the other lacks), this intentionally fails loud rather than
# guessing - that needs a manual reconciliation, same as the one
# already in this repo's git history.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub main
        run: git fetch https://github.com/miklosbagi/ha-hu-energy-tariff.git main

      - name: Compare, and open a fast-forward PR if GitHub is ahead
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          GITEA_TREE=$(git rev-parse HEAD^{tree})
          GITHUB_TREE=$(git rev-parse FETCH_HEAD^{tree})

          if [ "$GITEA_TREE" = "$GITHUB_TREE" ]; then
            echo "Already in sync (identical content) - nothing to do."
            exit 0
          fi

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            # Gitea is ahead of GitHub - completely normal (a Gitea PR
            # merged and its promote-to-github.yml PR just hasn't been
            # reviewed/merged yet). Nothing for THIS job to do; it'll
            # resolve itself once that GitHub PR lands.
            echo "Gitea main is ahead of GitHub main (pending promotion) - nothing to do here."
            exit 0
          fi

          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Gitea main and GitHub main have both moved independently (neither is an ancestor of the other) - needs a manual reconciliation, same as the one already in this repo's history. Refusing to guess."
            exit 1
          fi

          echo "GitHub main is ahead - pushing the sync branch."
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" \
            push --force origin FETCH_HEAD:refs/heads/github-sync

          python3 - <<'PY'
          import json
          import os
          import ssl
          import urllib.request

          token = os.environ["GITEA_TOKEN"]
          base = os.environ["GITEA_API_BASE"]

          # This Gitea instance's internal CA bundle is bind-mounted into
          # this runner's job containers at /certs/ca_bundle.crt (see the
          # comment in label-pr.yml for the full story) - urllib doesn't
          # pick that up automatically the way git does via
          # GIT_SSL_CAINFO, so build an explicit trust context from it
          # rather than disabling verification.
          ssl_context = ssl.create_default_context(cafile="/certs/ca_bundle.crt")

          def request(method, path, payload=None):
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=json.dumps(payload).encode() if payload is not None else None,
                  method=method,
                  headers={
                      "Authorization": f"token {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, context=ssl_context) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          existing = request(
              "GET", "/pulls?state=open&type=all&head=github-sync"
          )
          # Gitea's `head` filter behavior varies by version - filter
          # defensively rather than trust it did the filtering.
          open_prs = [
              pr for pr in (existing or [])
              if pr["head"]["ref"] == "github-sync" and pr["base"]["ref"] == "main"
          ]

          if open_prs:
              print(f"Sync PR #{open_prs[0]['number']} is already open - nothing more to do.")
          else:
              pr = request(
                  "POST",
                  "/pulls",
                  {
                      "title": "Sync from GitHub",
                      "head": "github-sync",
                      "base": "main",
                      "body": (
                          "Automated - opens whenever GitHub main gets ahead of "
                          "Gitea main (a community PR merged there, or anything "
                          "else that landed on GitHub outside the normal Gitea "
                          "-> GitHub promotion flow). This is a pure fast-forward "
                          "(never rewrites history or discards anything) - please "
                          "merge using Gitea's \"Fast Forward\" merge style once "
                          "checks pass."
                      ),
                  },
              )
              print(f"Opened sync PR #{pr['number']}")
          PY
