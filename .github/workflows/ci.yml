name: CI

# The full coverage-floor + coverage-drop gate lives on Gitea only now
# (.gitea/workflows/ci.yml) - Gitea is the sole release authority (see
# docs/RELEASING.md), so every change that actually ships already
# passed that gate there before reaching this repo via a gitea-promote/*
# PR, and re-running the same expensive comparison here would be pure
# duplicate compute. This job stays as a plain test-pass safety net
# specifically for the case Gitea's gate can't cover: a community PR
# opened directly here, which never touches Gitea until after it
# merges.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v
