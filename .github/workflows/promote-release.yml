name: Promote release from Gitea

# Gitea is the sole authority for deciding version numbers (see
# docs/RELEASING.md) - a Gitea PR merge already computed the tag and
# pushed it here as a bare ref (see .gitea/workflows/release-and-
# promote.yml), plus created the actual release on Gitea itself. A
# bare tag with no GitHub Release wrapping it is inert (HACS and most
# tooling watch Releases, not tags) - this job is what turns it into
# an actual Release, but only once a human merges the promoted PR
# here, which is what makes the version installable via HACS.
#
# Finds the tag to release by walking git history - any semver tag
# that (a) is now an ancestor of this merge and (b) has no GitHub
# Release yet - rather than reading it out of the PR body. It never
# computes a version number itself, which is exactly what avoids the
# two platforms disagreeing (this happened once, under the previous
# GitHub-is-authority arrangement - see docs/RELEASING.md).
#
# Only fires for promotion PRs (gitea-promote/* branches, matching the
# naming release-and-promote.yml uses). A plain community PR merged
# directly here doesn't get an immediate release - it flows into Gitea
# first via .gitea/workflows/sync-from-github.yml like any other
# change, and gets released from there whenever a maintainer next does
# so.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  promote-release:
    name: promote-release
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'gitea-promote/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find and release any tags this merge completes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASED_TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName')

          for TAG in $(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=v:refname); do
            if grep -qx "$TAG" <<< "$RELEASED_TAGS"; then
              continue  # already has a release
            fi
            if ! git merge-base --is-ancestor "$TAG" HEAD; then
              continue  # not part of this merge (yet)
            fi

            echo "Releasing $TAG"
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' --no-merges)
            else
              LOG=$(git log "$TAG" --pretty=format:'- %s (%h)' --no-merges)
            fi
            NOTES="_Version decided on Gitea, promoted here after merge - see docs/RELEASING.md._"$'\n\n'"$LOG"
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          done
