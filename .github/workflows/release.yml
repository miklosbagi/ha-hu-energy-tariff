name: Release

# Tags and releases main on PR merge, driven by the merged PR's Tag/*
# label (Tag/Major > Tag/Minor > Tag/Patch precedence if more than one
# is somehow present; no Tag/* label at all means no tag/release - see
# docs/RELEASING.md). This workflow only ever runs after a human merges
# a PR; it never merges anything itself.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag-and-release:
    name: tag-and-release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump from PR labels
        id: bump
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "PR labels: $LABELS_JSON"
          # Defensive: toJson() on an empty label set has been observed
          # to evaluate to the literal string `null` (not `[]`) on at
          # least one GitHub-Actions-compatible engine (Gitea Actions,
          # see .gitea/workflows/release.yml) - guard against that here
          # too rather than assume GitHub's engine never will. This case
          # matters specifically: "remove every Tag/* label" is a
          # documented, intentional way to skip tagging/releasing (see
          # docs/RELEASING.md), so it must resolve to level=none, not
          # crash the workflow.
          HAS_MAJOR=$(echo "$LABELS_JSON" | python3 -c "import json,sys; data = json.load(sys.stdin); print('Tag/Major' in (data if isinstance(data, list) else []))")
          HAS_MINOR=$(echo "$LABELS_JSON" | python3 -c "import json,sys; data = json.load(sys.stdin); print('Tag/Minor' in (data if isinstance(data, list) else []))")
          HAS_PATCH=$(echo "$LABELS_JSON" | python3 -c "import json,sys; data = json.load(sys.stdin); print('Tag/Patch' in (data if isinstance(data, list) else []))")

          if [ "$HAS_MAJOR" = "True" ]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_MINOR" = "True" ]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PATCH" = "True" ]; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "level=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        if: steps.bump.outputs.level != 'none'
        run: |
          LATEST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
          case "${{ steps.bump.outputs.level }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "Previous tag: $LATEST_TAG -> New tag: $NEW_TAG"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.bump.outputs.level != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release with auto-generated notes
        if: steps.bump.outputs.level != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes "_Auto-generated changelog below. A maintainer/agent should edit this release afterwards to add a human-readable summary - see docs/RELEASING.md._"
