[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.coverage.run]
# NB: the actual CI gate passes --cov=custom_components/hu_energy_tariff
# explicitly (singular - that's the real package name, see manifest.json's
# "domain"), which takes precedence over this value - this `source` was
# stale (plural, a directory that doesn't exist) and only mattered for
# ad-hoc local `coverage run`/`pytest --cov` invocations without an
# explicit --cov flag.
source = ["custom_components/hu_energy_tariff"]
branch = true

[tool.coverage.report]
# CI additionally enforces a max-10-point coverage drop vs. the PR's base
# branch (see .github/workflows/ci.yml) - fail_under is only the static
# floor, checked on every run including outside CI.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle/pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # flake8-simplify
]
